name: Deploy Nightly Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'flake.nix'
      - 'flake.lock'

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy nightly docs to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build docs
        run: nix run .#doc -- /cli20/nightly/

      - name: Deploy to gh-pages/nightly
        run: |
          set -eu

          git fetch origin gh-pages:gh-pages || true
          if git rev-parse --verify gh-pages > /dev/null 2>&1; then
            git worktree add gh-pages-out gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-out
          fi
          cd gh-pages-out

          rm -rf nightly
          mkdir -p nightly
          cp -r ../result/. nightly/

          touch .nojekyll

          python3 "$GITHUB_WORKSPACE/script/gen_versions_json.py"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "docs: nightly build"

      - name: Push gh-pages
        run: |
          cd gh-pages-out
          git push origin gh-pages
