name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate single header
        run: python3 script/make_single_header.py include/cli single_header/cli20.hh

      - name: Package include/
        run: tar -czf "cli20-${GITHUB_REF_NAME}-include.tar.gz" include

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-pre') }}
          generate_release_notes: true
          files: |
            cli20-${{ github.ref_name }}-include.tar.gz
            single_header/cli20.hh
