name: Bump Version

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Create version bump PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Compute next patch version
        id: next
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create branch and bump VERSION
        run: |
          NEXT="${{ steps.next.outputs.version }}"
          BRANCH="bump/v${NEXT}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$BRANCH"
          echo "$NEXT" > VERSION
          git add VERSION
          git commit -m "chore: bump version to v${NEXT}"
          git push origin "$BRANCH"

      - name: Open PR
        run: |
          NEXT="${{ steps.next.outputs.version }}"
          gh pr create \
            --title "chore: bump version to v${NEXT}" \
            --body "Automatically generated after release \`${GITHUB_REF_NAME}\`. Adjust the version in \`VERSION\` if a major or minor bump is needed instead." \
            --base main \
            --head "bump/v${NEXT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
