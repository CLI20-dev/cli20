name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Format check (uses nix to match the exact clang-format version in nix fmt) ──
  check:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: |
          if ! nix fmt -- --ci; then
            echo ""
            echo "::error::Formatting check failed."
            echo "Please run 'nix fmt' (or './format.sh') and push the result."
            exit 1
          fi

  # ── Build + test matrix ───────────────────────────────────────────────────
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 Linux
          - {os: ubuntu-24.04,     compiler: gcc,         cc: gcc-16,   cxx: g++-16}
          - {os: ubuntu-24.04,     compiler: clang,       cc: clang-21, cxx: clang++-21, llvm: "21"}
          # aarch64 Linux
          - {os: ubuntu-24.04-arm, compiler: gcc,         cc: gcc-16,   cxx: g++-16}
          - {os: ubuntu-24.04-arm, compiler: clang,       cc: clang-21, cxx: clang++-21, llvm: "21"}
          # macOS ARM — Homebrew LLVM
          - {os: macos-26,         compiler: clang,       cc: "",       cxx: ""}
          # Windows — MSVC only
          - {os: windows-latest,   compiler: msvc,        cc: "",       cxx: ""}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install GCC 16 (Linux)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -q
          sudo apt-get install -y gcc-16 g++-16

      - name: Install Clang ${{ matrix.llvm }} from apt.llvm.org (Linux)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ \
            llvm-toolchain-noble-${{ matrix.llvm }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y clang-${{ matrix.llvm }}

      - name: Install compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          echo "CC=$(brew --prefix llvm)/bin/clang"    >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV

      - name: Install latest CMake + Ninja (Windows)
        if: runner.os == 'Windows'
        uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          COMPILER_FLAGS=""
          if [[ -n "${{ matrix.cc }}" ]]; then
            COMPILER_FLAGS="-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"
          elif [[ -n "${CC:-}" ]]; then
            COMPILER_FLAGS="-DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCXX_CLI20_ENABLE_TEST=ON \
            $COMPILER_FLAGS

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
