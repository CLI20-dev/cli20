name: Post-merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    name: Regenerate single header and format
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN pushes do not re-trigger workflows, but guard explicitly
    # against any bot-initiated push to avoid accidental loops.
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN — pushes made with this token do not
          # retrigger workflow runs, which prevents infinite loops.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Regenerate single header
        run: nix run nixpkgs#python3 -- script/make_single_header.py

      - name: Format
        run: nix fmt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: regenerate single header and apply formatting"
            git push
          fi
