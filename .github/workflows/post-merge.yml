name: Post-merge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update:
    name: Regenerate single header and format
    runs-on: ubuntu-24.04
    environment: single_header_autogen
    # Guard against the GitHub App bot's own pushes to prevent infinite loops.
    if: github.actor != 'cli20-single-header-autogen[bot]'

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.INSTALLATION_ID }}

      - uses: actions/checkout@v4
        with:
          # Use the GitHub App token so that the resulting push re-triggers CI.
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Regenerate single header
        run: nix run nixpkgs#python3 -- script/make_single_header.py

      - name: Format
        run: nix fmt

      - name: Commit and push if changed
        run: |
          git config user.name "cli20-single-header-autogen[bot]"
          git config user.email "cli20-single-header-autogen[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: regenerate single header and apply formatting"
            git push
          fi
